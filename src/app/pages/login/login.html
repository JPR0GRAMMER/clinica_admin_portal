<div class="login-container">
  <div class="login-left">
    <div class="hero-text">
      <h1>SISTEMA DE GESTIÓN DOCUMENTAL</h1>
      <p>Transformando la Gestión Documental hacia una Administración Segura e Inteligente.</p>
    </div>
  </div>
  <div class="login-right">
    <div class="form-wrapper glass-card">
      <div class="header">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2ZM2 17L12 22L22 17V19.5L12 24L2 19.5V17ZM2 12L12 17L22 12V14.5L12 19.5L2 14.5V12Z"/>
          </svg>
          <span class="logo-text">Gestión <span style="color: #4a8cf8; font-weight: 300;">Clínica</span></span>
        </div>
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()" title="Mostrar contraseña">
              @if (!showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              }
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span>
          }
          <span>{{ isLoading() ? 'Iniciando sesión...' : 'Iniciar sesión' }}</span>
        </button>
      </form>
    </div>
  </div>
</div>
